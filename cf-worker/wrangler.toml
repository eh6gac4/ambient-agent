name = "ambient-agent"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
logpush = true

[triggers]
crons = [
  "30 22-23,0-12 * * *",  # 毎時30分 (JST 07:30-21:30): hourly_gmail (silent batch)
  "20 20 * * *",          # 05:20 JST: morning_prep (learn→calendar→escalation)
  "30 20 * * *",           # 05:30 JST: morning_briefing (briefing→cost→due_soon→email_digest)
  "0 0 * * 1",            # 月 09:00 JST: stale_tasks_notice
]

[[kv_namespaces]]
binding = "AGENT_KV"
id = "c00f19dce0fb4fc495e9425608e53283"

[[d1_databases]]
binding = "AGENT_DB"
database_name = "ambient-agent-db"
database_id = "ba5c15ff-8e0e-4b86-b020-f1c4cb5975a3"

[[d1_databases]]
binding = "GROCERY_DB"
database_name = "grocery-list-db"
database_id = "df6ec9f6-01a4-4f57-a5cb-834f25e179e1"


# secrets (set via: wrangler secret put SECRET_NAME)
# GEMINI_API_KEY
# NOTION_TOKEN
# NOTION_TASKS_DB_ID
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID
# ALERT_TOKEN          # GET /home-arrival /office-leave 認証用の共有シークレット
# OWNTRACKS_TOKEN      # POST /owntracks (OwnTracks Webhook) 認証用の共有シークレット
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# GOOGLE_REFRESH_TOKEN

[observability]
enabled = true

# optional vars (set via wrangler.toml [vars] or secret)
# GMAIL_ACCOUNT_INDEX=0  # Gmail の u/N のN（複数アカウント時に変更）
